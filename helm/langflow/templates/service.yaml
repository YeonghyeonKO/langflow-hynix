apiVersion: v1
kind: Service
metadata:
  name: {{ include "langflow.fullname" . }}-backend
  labels:
    {{- include "langflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "langflow.backendSelectorLabels" . | nindent 4 }}
  ports:
    - port: 7860
      targetPort: 7860
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "langflow.fullname" . }}-frontend
  labels:
    {{- include "langflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "langflow.frontendSelectorLabels" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.frontend.port }}
